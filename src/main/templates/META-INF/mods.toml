modLoader = "javafml"
loaderVersion = "[1,)"
#issueTrackerURL = ""
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''
${mod_description}
'''
logoFile = "icon.png"

# NOTE: the table header must NOT be quoted. Writing [["dependencies.${mod_id}"]] makes TOML
# parse "dependencies.controlify" as a single flat key instead of a nested table, so Forge
# finds no dependency table at all, reports "Found 0 mod requirements missing" and skips the
# missing-dependency check entirely - the game then dies with a NoClassDefFoundError while
# constructing the mod instead of showing the missing-dependencies screen.
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mc}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
mandatory = true
# only require presence, not a specific YACL version
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
