modLoader = "javafml"
loaderVersion = "[1,)"
#issueTrackerURL = ""
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''
${mod_description}
'''
logoFile = "icon.png"

# NOTE: the table header must NOT be quoted. Writing [["dependencies.${mod_id}"]] makes TOML
# parse "dependencies.controlify" as a single flat key instead of a nested table, so NeoForge
# finds no dependency table at all and skips the missing-dependency check entirely.
# NeoForge expresses dependency kind with `type` (required/optional/incompatible/discouraged);
# `required` is also the default, so a parser that ignores `type` still behaves correctly.
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
type = "required"
# only require presence, not a specific YACL version
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
